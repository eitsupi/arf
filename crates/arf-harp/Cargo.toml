[package]
name = "arf-harp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "High-level R abstractions for safe R object manipulation"

[features]
# Enables counters used only by the ignored completion integration spike.
completion-spike = []
# Opt-in static-first argument completion for `pkg::foo(`. Static package
# artifacts are not guaranteed to match loaded namespaces, `.onLoad`, active
# bindings, or runtime mutation; all non-Available cases retain the R fallback.
experimental-static-formals = []

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true

[dependencies]
arf-libr.workspace = true
r-vignette-to-md.workspace = true
rd2qmd-core.workspace = true
rd-source.workspace = true
rd-helpdb.workspace = true
rd-rds.workspace = true
rd-ast = { workspace = true, features = ["rds"] }
log.workspace = true
thiserror.workspace = true
once_cell.workspace = true
