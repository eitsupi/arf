[package]
name = "arf-harp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "High-level R abstractions for safe R object manipulation"

[features]
command-outcome-spike = []
mainloop-unwind-spike = []
repl-semantics-spike = []
nested-recovery-spike = []

[[example]]
name = "command-outcome-spike"
required-features = ["command-outcome-spike"]
test = false
bench = false

[[example]]
name = "mainloop-unwind-spike"
required-features = ["mainloop-unwind-spike"]
test = false
bench = false

[[example]]
name = "repl-semantics-spike"
required-features = ["repl-semantics-spike"]
test = false
bench = false

[[example]]
name = "nested-recovery-spike"
required-features = ["nested-recovery-spike"]
test = false
bench = false

[dev-dependencies]
libloading.workspace = true
tempfile.workspace = true
insta.workspace = true

[dependencies]
arf-libr.workspace = true
r-vignette-to-md.workspace = true
rd2qmd-core.workspace = true
rd-source.workspace = true
rd-helpdb.workspace = true
rd-rds.workspace = true
rd-ast = { workspace = true, features = ["rds"] }
log.workspace = true
thiserror.workspace = true
once_cell.workspace = true
