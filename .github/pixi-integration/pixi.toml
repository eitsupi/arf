[workspace]
name = "arf-pixi-r-source-tests"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
r-base = "*"
r-jsonlite = "*"
r-curl = "*"
python = "3.13.*"

[tasks]
verify = "python run.py"

[environments]
default = { features = [], solve-group = "r-source" }
analysis = { features = [], solve-group = "r-source" }
