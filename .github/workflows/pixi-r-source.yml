name: Pixi R source

on:
  pull_request:
    paths:
      - .github/workflows/pixi-r-source.yml
      - .github/pixi-r-source/**
      - crates/**
      - Cargo.*
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - .github/workflows/pixi-r-source.yml
      - .github/pixi-r-source/**
      - crates/**
      - Cargo.*
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          manifest-path: .github/pixi-r-source/pixi.toml
          cache: false
          locked: true
      - name: Build production arf and integration tests
        shell: bash
        run: cargo build --locked --bin arf --tests
      - name: Verify default activated environment
        shell: bash
        env:
          ARF_PIXI_RESULTS: ${{ runner.temp }}/arf-pixi-default
        run: pixi run --manifest-path .github/pixi-r-source/pixi.toml --locked --environment default verify
      - name: Configure detached named environment
        shell: bash
        env:
          ARF_TEST_DETACHED_PREFIX: ${{ runner.temp }}/arf-pixi-detached
        run: pixi run --manifest-path .github/pixi-r-source/pixi.toml --locked --environment default python .github/pixi-r-source/configure_detached.py
      - name: Verify detached named activated environment
        shell: bash
        env:
          ARF_PIXI_RESULTS: ${{ runner.temp }}/arf-pixi-analysis
        run: pixi run --manifest-path .github/pixi-r-source/pixi.toml --locked --environment analysis verify
      - name: Upload diagnostics and terminal recordings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixi-r-source-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/arf-pixi-default
            ${{ runner.temp }}/arf-pixi-analysis
          if-no-files-found: warn
